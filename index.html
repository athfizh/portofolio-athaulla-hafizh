<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Athaulla Hafizh | Informatics Engineering & Developer</title>
  <meta name="description" content="Informatics Engineering student, Chairman of HMTI Polinema, and developer building clean, purposeful digital experiences across web, mobile, and applied AI." />
  <meta name="author" content="Athaulla Hafizh" />
  <link rel="canonical" href="https://athfizh.github.io/portofolio-athaulla-hafizh/" />

  <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://athfizh.github.io/portofolio-athaulla-hafizh/" />
  <meta property="og:title" content="Athaulla Hafizh | Portfolio" />
  <meta property="og:description" content="Informatics Engineering student & Chairman of HMTI Polinema. Exploring web, mobile, and AI solutions." />
  <meta property="og:image" content="https://athfizh.github.io/portofolio-athaulla-hafizh/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Athaulla Hafizh | Portfolio" />
  <meta name="twitter:description" content="Informatics Engineering student & Chairman of HMTI Polinema. Exploring web, mobile, and AI solutions." />
  <meta name="twitter:image" content="https://athfizh.github.io/portofolio-athaulla-hafizh/og-image.jpg" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>

  <!-- Custom cursor (desktop) -->
  <div id="cursor-dot"  class="cursor-dot"  aria-hidden="true"></div>
  <div id="cursor-ring" class="cursor-ring" aria-hidden="true"></div>

  <!-- NAVBAR -->
  <header id="navbar"
          style="position:fixed;top:0;left:0;right:0;z-index:100;
                 background:var(--nav-bg);backdrop-filter:blur(12px);
                 -webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent;
                 transition:border-color 0.3s ease, background-color 0.3s ease;">
    <div class="container-xl" style="height:60px;display:flex;align-items:center;justify-content:space-between;">

      <a id="nav-logo" href="#about"
         style="font-family:'DM Serif Display',serif;font-size:1.0625rem;color:var(--charcoal);
                text-decoration:none;letter-spacing:-0.01em;"></a>

      <div style="display:flex;align-items:center;gap:1.5rem;">
        <nav id="nav-desktop" style="display:flex;align-items:center;gap:1.75rem;"></nav>

        <!-- Command palette shortcut & Theme toggle -->
        <div style="display:flex;align-items:center;gap:0.5rem;">
          <button id="cmd-trigger-btn" aria-label="Command Menu (Ctrl+K)" title="Quick Actions (Ctrl+K)"
                  style="background:var(--cream);border:1px solid var(--border);border-radius:6px;
                         padding:0.25rem 0.5rem;font-size:0.6875rem;color:var(--muted);cursor:pointer;
                         display:inline-flex;align-items:center;gap:0.25rem;font-family:'Inter',monospace;
                         transition:border-color 0.2s,color 0.2s;">
            <span>⌘K</span>
          </button>

          <button id="theme-toggle-btn" aria-label="Toggle Theme" title="Toggle Dark/Light Mode"
                  style="background:var(--cream);border:1px solid var(--border);border-radius:6px;
                         width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;
                         color:var(--charcoal);cursor:pointer;transition:background 0.2s,border-color 0.2s;">
            <svg id="theme-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>

        <button id="hamburger-btn" class="hamburger" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>

    <div id="mobile-menu" style="display:none;border-top:1px solid var(--border);background:var(--paper);">
      <nav id="nav-mobile" class="container-xl"
           style="padding-top:1rem;padding-bottom:1rem;display:flex;flex-direction:column;gap:0.125rem;"></nav>
    </div>
  </header>


  <!-- ABOUT (Hero replacement) -->
  <section id="about"
           style="background:var(--paper);padding-top:calc(60px + 3.5rem);padding-bottom:5rem;">
    <div class="container-xl">

      <!-- The one complex card -->
      <div id="about-card"
           style="display:grid;grid-template-columns:2fr 3fr;
                  border:1px solid var(--border);border-radius:10px;overflow:hidden;
                  min-height:620px;background:var(--card-bg);">

        <!-- Left: photo fills column entirely -->
        <div id="about-photo-col" style="position:relative;background:var(--cream-dark);min-height:400px;">
          <img id="about-photo" alt="Athaulla Hafizh"
               style="position:absolute;inset:0;width:100%;height:100%;
                      object-fit:cover;object-position:center top;display:block;" />
        </div>

        <!-- Right: all text content -->
        <div id="about-content"
             style="padding:2.5rem 3rem;display:flex;flex-direction:column;gap:1.5rem;
                    border-left:1px solid var(--border);background:var(--paper);">
          <!-- Rendered by JS -->
        </div>

      </div>
    </div>
  </section>


  <!-- EXPERIENCE -->
  <section id="experience"
           style="background:var(--cream);border-top:1px solid var(--border);">
    <div class="container-xl section">
      <p class="label">Experience</p>
      <h2 class="heading-section" style="margin-bottom:3rem;">Leadership & Roles</h2>
      <div id="experience-list"></div>
    </div>
  </section>


  <!-- AWARDS -->
  <section id="awards"
           style="background:var(--paper);border-top:1px solid var(--border);">
    <div class="container-xl section">
      <p class="label">Recognition</p>
      <h2 class="heading-section" style="margin-bottom:3rem;">Honors & Awards</h2>
      <div id="awards-list" style="display:flex;flex-direction:column;gap:2rem;"></div>
    </div>
  </section>

  <!-- PROJECTS -->
  <section id="projects"
           style="background:var(--cream);border-top:1px solid var(--border);">
    <div class="container-xl section">
      <p class="label">Work</p>
      <h2 class="heading-section" style="margin-bottom:3rem;">Selected Projects</h2>
      <div id="projects-list"></div>
    </div>
  </section>


  <!-- SKILLS & CERTIFICATIONS -->
  <section id="skills"
           style="background:var(--paper);border-top:1px solid var(--border);">
    <div class="container-xl section">
      <h2 class="heading-section" style="margin-bottom:3rem;">Skills & Credentials</h2>

      <div class="skills-grid"
           style="display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:start;">

        <div>
          <p style="font-size:0.6875rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;
                    color:var(--muted);margin-bottom:1.5rem;">Capabilities</p>
          <div id="capabilities-list" style="display:flex;flex-direction:column;gap:1.75rem;"></div>
        </div>

        <div>
          <p style="font-size:0.6875rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;
                    color:var(--muted);margin-bottom:1.5rem;">Certifications</p>
          <div id="certifications-list"></div>
        </div>

      </div>
    </div>
  </section>


  <!-- CONTACT -->
  <section id="contact"
           style="background:var(--contact-bg);border-top:1px solid var(--border);">
    <div class="container-xl section" style="text-align:center;">
      <h2 id="contact-heading" class="heading-section"
          style="color:var(--contact-text);margin-bottom:1.25rem;max-width:22ch;margin-left:auto;margin-right:auto;"></h2>
      <p id="contact-tagline" class="body-md"
         style="color:var(--muted);max-width:44ch;margin-left:auto;margin-right:auto;margin-bottom:3rem;"></p>
      <div id="contact-links"
           style="display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:2rem;"></div>
    </div>
  </section>


  <!-- FOOTER -->
  <footer style="background:var(--footer-bg);border-top:1px solid var(--footer-border);padding:1.75rem 0;transition:background-color 0.3s ease;">
    <div class="container-xl"
         style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1.25rem;">
      <div>
        <p style="color:var(--footer-text);font-size:0.875rem;font-weight:500;letter-spacing:-0.01em;margin-bottom:0.15rem;">Athaulla Hafizh</p>
        <p style="color:var(--footer-subtext);font-size:0.75rem;">Informatics Engineering · Polinema</p>
      </div>

      <div style="display:flex;align-items:center;gap:0.5rem;">
        <span style="width:6px;height:6px;border-radius:50%;background:#4caf50;display:inline-block;box-shadow:0 0 0 2px rgba(76,175,80,0.2);"></span>
        <p id="footer-live-time" style="color:var(--footer-subtext);font-size:0.8125rem;font-variant-numeric:tabular-nums;font-family:'Inter',monospace;"></p>
      </div>

      <div>
        <p style="color:var(--footer-subtext);font-size:0.8125rem;">© 2026 · All rights reserved</p>
      </div>
    </div>
  </footer>

  <!-- LIGHTBOX MODAL FOR IMAGES -->
  <div id="lightbox-modal"
       style="display:none;position:fixed;inset:0;z-index:200;background:rgba(20,20,20,0.88);
              backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
              align-items:center;justify-content:center;padding:1.5rem;"
       aria-hidden="true">
    <div style="position:relative;max-width:900px;width:100%;max-height:90vh;display:flex;flex-direction:column;align-items:center;">
      <button id="lightbox-close"
              style="position:absolute;top:-2.5rem;right:0;background:none;border:none;color:#fff;
                     font-size:1.75rem;cursor:pointer;line-height:1;padding:0.25rem;"
              aria-label="Close modal">✕</button>
      <img id="lightbox-img" src="" alt="Documentation Preview"
           style="max-width:100%;max-height:78vh;object-fit:contain;border-radius:6px;box-shadow:0 20px 40px rgba(0,0,0,0.4);" />
      <p id="lightbox-caption"
         style="color:#ccc;font-size:0.875rem;margin-top:1rem;text-align:center;font-family:'Inter',sans-serif;"></p>
    </div>
  </div>

  <!-- Back to top button -->
  <button id="back-to-top" class="btn-back-to-top" aria-label="Scroll back to top">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="19" x2="12" y2="5"></line>
      <polyline points="5 12 12 5 19 12"></polyline>
    </svg>
  </button>

  <!-- Toast Notification Container -->
  <div id="toast" class="toast-container" role="status" aria-live="polite">
    <span id="toast-icon" style="color:#4caf50;">✓</span>
    <span id="toast-message">Email copied to clipboard!</span>
  </div>

  <!-- Command Palette Modal (Ctrl+K) -->
  <div id="cmd-backdrop" class="cmd-backdrop" aria-hidden="true">
    <div class="cmd-modal">
      <div class="cmd-input-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="cmd-input" class="cmd-input" type="text" placeholder="Type a command or search section..." autocomplete="off" spellcheck="false" />
        <span class="cmd-badge">ESC</span>
      </div>
      <div id="cmd-list" class="cmd-list"></div>
    </div>
  </div>

  <style>
    @media (max-width: 768px) {
      #about-card    { grid-template-columns: 1fr !important; }
      #about-card > div:first-child { min-height: 300px !important; position: relative !important; }
      #about-card > div:last-child  { border-left: none !important; border-top: 1px solid var(--border) !important; padding: 1.75rem !important; }
      .skills-grid   { grid-template-columns: 1fr !important; gap: 3rem !important; }
      .exp-row       { grid-template-columns: 1fr !important; }
    }
  </style>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
